name: Study app checks
on:
  pull_request:
    paths: ['study/**', 'seed/**', 'web/study-bridge.js', 'server/study_import.py', '.github/workflows/study-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  study:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - name: Build and test without production credentials
        working-directory: study
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm run lint
          pnpm run build
          pnpm exec playwright install --with-deps chromium
          pnpm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: study-preview-and-checks
          path: |
            study/out
            study/test-results
