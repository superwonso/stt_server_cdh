<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>한능검 공부내용확인 학습하기</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{--bg:#EEF1F6;--card:#FFFFFF;--ink:#16213A;--sub:#5B667D;--line:#D5DBE6;--accent:#0F6E8C;--accent-ink:#FFFFFF;--accent-soft:#DDEEF4;--ok:#1E8E5A;--ok-soft:#DDF3E8;--bad:#C8472D;--bad-soft:#FBE6E0;--shadow:0 1px 2px rgba(22,33,58,.06),0 6px 20px rgba(22,33,58,.06);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1626;--card:#1A2338;--ink:#E8ECF5;--sub:#9AA6BF;--line:#2C3750;--accent:#4FB4D3;--accent-ink:#06202B;--accent-soft:#16384A;--ok:#4CC58A;--ok-soft:#173A2C;--bad:#F07A60;--bad-soft:#40211B;--shadow:none}}
:root[data-theme="dark"]{--bg:#0F1626;--card:#1A2338;--ink:#E8ECF5;--sub:#9AA6BF;--line:#2C3750;--accent:#4FB4D3;--accent-ink:#06202B;--accent-soft:#16384A;--ok:#4CC58A;--ok-soft:#173A2C;--bad:#F07A60;--bad-soft:#40211B;--shadow:none}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
body{min-height:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,label:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:18px 16px 56px}
h1{font-size:1.55rem;line-height:1.3;margin:6px 0 4px;letter-spacing:-.01em}
.lead{color:var(--sub);margin:0 0 18px;font-size:.95rem}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 16px;font-weight:500;min-height:44px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.ghost{background:transparent}
.btn.small{padding:6px 12px;min-height:36px;font-size:.88rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.modes .btn{padding:14px}
.parts{list-style:none;margin:0;padding:0}
.parts li{border-top:1px solid var(--line)}
.parts li:first-child{border-top:0}
.parts label{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer}
.parts input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.parts .name{flex:1;font-weight:500}
.parts .meta{color:var(--sub);font-size:.82rem;white-space:nowrap}
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.bar.ok>i{background:var(--ok)}
.sel-head{padding:12px 14px;border-bottom:1px solid var(--line)}
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.topbar .grow{flex:1}
.crumb{color:var(--sub);font-size:.82rem;margin-bottom:8px}
.q{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:22px 20px;margin-bottom:14px}
.qtext{font-size:1.18rem;line-height:1.65;white-space:pre-line;font-weight:500;margin:0}
.tag{display:inline-block;font-size:.78rem;border-radius:99px;padding:2px 10px;background:var(--accent-soft);color:var(--accent);margin-bottom:10px;font-weight:500}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;border:2px solid var(--line);background:var(--card);border-radius:12px;padding:13px 14px;min-height:52px;line-height:1.45;width:100%}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt .k{flex:none;width:24px;height:24px;border-radius:7px;background:var(--bg);color:var(--sub);font-size:.8rem;display:grid;place-items:center;margin-top:1px}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.ans-input{width:100%;font:inherit;font-size:1.1rem;padding:14px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
.ans-input:focus{border-color:var(--accent);outline:none}
.fb{border-radius:12px;padding:14px 16px;margin-top:12px}
.fb.ok{background:var(--ok-soft);border:1px solid var(--ok)}
.fb.bad{background:var(--bad-soft);border:1px solid var(--bad)}
.fb b{display:block;margin-bottom:2px}
.fb .ca{font-size:1.1rem;font-weight:700}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.actions .grow{flex:1}
.hint{color:var(--sub);font-size:.85rem;margin-top:8px}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.stat div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.stat b{display:block;font-size:1.5rem}
.stat span{font-size:.82rem;color:var(--sub)}
.fc{perspective:1200px;margin-bottom:14px}
.fc-in{position:relative;min-height:320px;transition:transform .4s;transform-style:preserve-3d;cursor:pointer}
.fc.flip .fc-in{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;justify-content:center;padding:22px 20px;overflow:auto}
.fc-back{transform:rotateY(180deg)}
.fc-ans{font-size:1.5rem;font-weight:700;text-align:center;line-height:1.5}
.legend{color:var(--sub);font-size:.82rem}
.list-item{padding:12px 14px;border-top:1px solid var(--line)}
.list-item:first-child{border-top:0}
.list-item .a{color:var(--ok);font-weight:700}
.list-item .t{white-space:pre-line;font-size:.92rem;color:var(--sub);margin-bottom:2px}
@media (prefers-reduced-motion:reduce){.fc-in,.bar>i{transition:none}}
@media (max-width:480px){.modes{grid-template-columns:1fr}.qtext{font-size:1.08rem}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

const shuffle=a=>{ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; };
const clean=s=>s.replace(/\s+/g,'').replace(/[·,.\/()\[\]「」“”'"~\-]/g,'').toLowerCase();

function seqTokens(a){ if(/→/.test(a)) return {t:a.split('→'),j:'→'}; return {t:a.replace(/\s/g,'').split(''),j:''}; }
function fakeSeqs(a,n){ const {t,j}=seqTokens(a); const out=new Set(); let tries=0; while(out.size<n&&tries<60){ tries++; const c=t.slice(); const i=Math.floor(Math.random()*c.length), k=Math.floor(Math.random()*c.length); if(i===k) continue; [c[i],c[k]]=[c[k],c[i]]; const s=c.join(j); if(s!==a) out.add(s);} return [...out]; }

    if(ds.length<3) take(cards.filter(c=>c.id!==card.id));
  }
